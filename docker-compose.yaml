# Run (interactive, needs a terminal):
#   docker compose build
#   docker compose run --rm k8s-agent
#
# Do NOT use "docker compose up": the agent asks questions and approvals on stdin,
# and "run" attaches your terminal properly.
services:
  k8s-agent:
    build:
      context: .
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    image: k8s-ai-agent:latest
    stdin_open: true          # prompts, approvals, multi-line task + /end
    tty: true
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}          # empty = the agent prompts for it
      KUBECONFIG: /home/agent/.kube/${KUBECONFIG_NAME:-config}
      MANIFEST_DIR: /manifest
    volumes:
      - ${KUBE_DIR:-${HOME}/.kube}:/home/agent/.kube:ro    # cluster access, read only
      - ./manifest:/manifest                               # YAML the agent writes (kept on the host)
    # Lets a kubeconfig that points at the host (e.g. https://host.docker.internal:6443) work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # If your cluster API is on 127.0.0.1 (kind, minikube, k3s on this machine), uncomment this on Linux:
    # network_mode: host
    # (remove extra_hosts when using network_mode: host)
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
