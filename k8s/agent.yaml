apiVersion: v1
kind: Namespace
metadata:
  name: k8s-ai-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-agent-discovery
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "storage.k8s.io", "policy", "autoscaling", "rbac.authorization.k8s.io", "apiextensions.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ai-agent-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-ai-agent-discovery
subjects:
  - kind: ServiceAccount
    name: k8s-ai-agent
    namespace: k8s-ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-ai-agent
subjects:
  - kind: ServiceAccount
    name: k8s-ai-agent
    namespace: k8s-ai-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-ai-agent
  template:
    metadata:
      labels:
        app: k8s-ai-agent
    spec:
      serviceAccountName: k8s-ai-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: k8s-ai-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: groq-api
          env:
            - name: GROQ_MODEL
              value: openai/gpt-oss-120b
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: manifests
              mountPath: /home/agent/manifest
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          emptyDir: {}
        - name: tmp
          emptyDir: {}
