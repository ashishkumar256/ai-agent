{{- if (values .Values.credentials | compact) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-ai-agent.credentialsSecretName" . }}
  labels:
    {{- include "k8s-ai-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.credentials.groqApiKey }}
  GROQ_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.credentials.githubToken }}
  GITHUB_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.credentials.gitlabToken }}
  GITLAB_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
