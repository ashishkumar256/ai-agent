apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-ai-agent.fullname" . }}
  labels:
    {{- include "k8s-ai-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-ai-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-ai-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-ai-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $credentialsSecret := include "k8s-ai-agent.credentialsSecretName" . }}
          {{- $configMapName := include "k8s-ai-agent.configMapName" . }}
          {{- if or $credentialsSecret $configMapName }}
          envFrom:
            {{- if $credentialsSecret }}
            - secretRef:
                name: {{ $credentialsSecret }}
            {{- end }}
            {{- if $configMapName }}
            - configMapRef:
                name: {{ $configMapName }}
            {{- end }}
          {{- end }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          stdin: {{ .Values.stdin }}
          tty: {{ .Values.tty }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: home-dir
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}