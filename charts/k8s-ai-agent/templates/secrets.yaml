{{- if .Values.credentials.create }}
{{- if or (empty .Values.credentials.groqApiKey) (empty .Values.credentials.githubToken) }}
{{- fail "credentials.groqApiKey and credentials.githubToken are required when credentials.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-ai-agent.credentialsSecretName" . }}
  labels:
    {{- include "k8s-ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.credentials.groqApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.credentials.githubToken | quote }}
{{- end }}
